  <rect width="64" height="64" rx="8" fill="#1a1a1a"/>
  <!-- bracket left -->
  <path d="M18 14 L12 14 L12 50 L18 50" stroke="#c8a87a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bracket right -->
  <path d="M46 14 L52 14 L52 50 L46 50" stroke="#c8a87a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- letter g -->
  <text x="32" y="43" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold"
        fill="#e8dcc8" text-anchor="middle">g</text>
  <!-- prime tick mark -->
